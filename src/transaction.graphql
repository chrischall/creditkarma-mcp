# Documentation only — never sent or loaded at runtime.
#
# Credit Karma's gateway executes only safelisted persisted queries, so
# `fetchPage()` sends `GetTransactions` as a sha256 hash
# (TRANSACTION_QUERY_HASH in src/client.ts), not this text. This records the
# part of the response `parseTransactionPage` and the sync actually read; the
# real persisted query selects a superset (and error-card UI fragments, omitted
# here).

query GetTransactions($input: Prime_TransactionFiltersInput) {
    prime {
        transactionsHub(input: $input) {
            ... on Prime_Transactions {
                transactionPage {
                    ... on Prime_TransactionPage {
                        transactions {
                            ... on Prime_Transaction {
                                id
                                date
                                description
                                status
                                amount {
                                    ... on Prime_AmountOfUsd { value asCurrencyString }
                                }
                                account {
                                    id                           # always "" — see src/accountId.ts
                                    name
                                    type
                                    providerName
                                    accountTypeAndNumberDisplay  # "Credit Card (..1234)"
                                    accountURN                   # urn:account:fdp::accountid:<uuid> — also the Intuit vault's accountId
                                }
                                category { id name type }
                                merchant { id name }
                            }
                        }
                        pageInfo {
                            ... on Prime_PageInfo { startCursor endCursor hasNextPage hasPreviousPage }
                        }
                    }
                }
            }
        }
    }
}
